<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Criatura Light</title>
<meta name="description" content="A versão leve do Criatura Problemática PRO: galeria, clientes, financeiro e ideias no celular e no tablet.">
<meta name="theme-color" content="#15171e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Criatura">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
:root {
  --bg: #0d0e12; --panel: #15171e; --card: #1c1f2a; --line: #2b2f3e; --text: #e2e4ed; --muted: #8a90a4;
  --accent: #a98be8; --accent-soft: rgba(169,139,232,.14); --accent-line: rgba(169,139,232,.38);
  --green: #6fcf97; --red: #e98a8a; --yellow: #e5c46a;
  --r: 14px; --safe-b: env(safe-area-inset-bottom, 0px); --safe-t: env(safe-area-inset-top, 0px);
  --nav-h: 62px;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
body { overscroll-behavior-y: contain; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
input, select, textarea { width: 100%; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; outline: none; min-height: 42px; }
input:focus, select:focus, textarea:focus { border-color: var(--accent-line); }
textarea { resize: vertical; min-height: 90px; }
label.f { display: block; font-size: 12px; font-weight: 700; color: var(--muted); margin: 12px 0 5px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 40px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); font-weight: 650; }
.btn.primary { background: var(--accent-soft); border-color: var(--accent-line); color: #d9cbff; }
.btn.danger { color: var(--red); border-color: rgba(233,138,138,.35); background: transparent; }
.btn.ghost { background: transparent; }
.btn:disabled { opacity: .45; }
.row { display: flex; gap: 8px; align-items: center; }
.row > * { flex: 1; min-width: 0; }
input[type=date] { min-width: 0; width: 100%; }
.muted { color: var(--muted); }
small { font-size: 12px; }

/* layout */
#app { min-height: 100%; padding: calc(var(--safe-t) + 0px) 0 calc(var(--nav-h) + var(--safe-b) + 10px); }
header.top { position: sticky; top: 0; z-index: 20; background: rgba(13,14,18,.92); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); padding: calc(var(--safe-t) + 10px) 16px 10px; border-bottom: 1px solid var(--line); }
header.top h1 { margin: 0; font-size: 19px; display: flex; align-items: center; gap: 8px; }
header.top .sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
main { padding: 12px 16px 24px; max-width: 1200px; margin: 0 auto; }
nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; display: flex; background: rgba(21,23,30,.97); border-top: 1px solid var(--line); padding-bottom: var(--safe-b); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
nav.tabs button { flex: 1; height: var(--nav-h); background: none; border: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11px; color: var(--muted); position: relative; }
nav.tabs button .ic { font-size: 21px; line-height: 1; }
nav.tabs button.on { color: var(--text); }
nav.tabs button.on::before { content: ''; position: absolute; top: 0; left: 28%; right: 28%; height: 2px; border-radius: 2px; background: var(--accent); }
nav.tabs .dot { position: absolute; top: 9px; right: calc(50% - 16px); width: 7px; height: 7px; border-radius: 50%; background: var(--yellow); }
@media (min-width: 820px) {
  #app { padding: 0 0 20px 92px; }
  nav.tabs { top: 0; right: auto; width: 82px; flex-direction: column; justify-content: flex-start; padding: calc(var(--safe-t) + 14px) 0 0; border-top: 0; border-right: 1px solid var(--line); }
  nav.tabs button { flex: 0 0 auto; height: 70px; }
  nav.tabs button.on::before { top: 14px; bottom: 14px; left: 0; right: auto; width: 3px; height: auto; }
  main { padding: 16px 24px 30px; }
  header.top { padding-left: 24px; }
}

/* FAB */
.fab { position: fixed; right: 18px; bottom: calc(var(--nav-h) + var(--safe-b) + 16px); z-index: 25; width: 56px; height: 56px; border-radius: 18px; border: 1px solid var(--accent-line); background: #2a2340; color: #e7dcff; font-size: 28px; box-shadow: 0 8px 22px rgba(0,0,0,.45); }
@media (min-width: 820px) { .fab { bottom: 24px; right: 28px; } }

/* chips e segmentos (tudo com altura fixa: nada pula) */
.seg { display: inline-flex; background: var(--panel); border: 1px solid var(--line); border-radius: 11px; padding: 3px; gap: 2px; }
.seg button { border: 0; background: none; height: 32px; padding: 0 12px; border-radius: 8px; color: var(--muted); font-weight: 650; font-size: 13px; }
.seg button.on { background: var(--accent-soft); color: var(--text); }
.chips { display: flex; gap: 8px; overflow-x: auto; padding: 2px 0 8px; scrollbar-width: none; min-height: 46px; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: 0 0 auto; display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 13px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel); font-size: 13px; font-weight: 650; white-space: nowrap; }
.chip.on { border-color: var(--accent-line); background: var(--accent-soft); }
.chip em { font-style: normal; font-size: 11px; color: var(--muted); }
.chip.new { border-style: dashed; color: var(--muted); }
.toolbar { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; flex-wrap: wrap; }
.toolbar .search { flex: 1; min-width: 160px; }

/* galeria */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(108px, 1fr)); gap: 8px; }
@media (min-width: 600px) { .grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; } }
.tile { position: relative; aspect-ratio: 1; border-radius: 12px; overflow: hidden; background: var(--card); border: 1px solid var(--line); user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
.tile img { width: 100%; height: 100%; object-fit: cover; display: block; pointer-events: none; }
.tile.blur img { filter: blur(18px) saturate(.6); transform: scale(1.15); }
.tile .tg { position: absolute; left: 6px; bottom: 6px; font-size: 10px; font-weight: 800; padding: 2px 6px; border-radius: 6px; background: rgba(200,90,110,.85); color: #fff; }
.tile .ck { position: absolute; top: 6px; right: 6px; width: 24px; height: 24px; border-radius: 50%; border: 2px solid rgba(255,255,255,.8); background: rgba(0,0,0,.3); display: none; }
.selecting .tile .ck { display: block; }
.tile.sel .ck { background: var(--accent); border-color: #fff; }
.tile.sel { outline: 2px solid var(--accent); outline-offset: -2px; }
.empty { text-align: center; color: var(--muted); padding: 48px 16px; border: 1px dashed var(--line); border-radius: var(--r); }
.empty b { color: var(--text); }
.selbar { position: fixed; left: 0; right: 0; bottom: calc(var(--nav-h) + var(--safe-b)); z-index: 26; display: flex; gap: 8px; padding: 10px 12px; background: var(--panel); border-top: 1px solid var(--line); overflow-x: auto; }
.selbar .btn { flex: 0 0 auto; }
@media (min-width: 820px) { .selbar { left: 82px; bottom: 0; } }

/* visualizador */
#viewer { position: fixed; inset: 0; z-index: 60; background: #000; display: none; flex-direction: column; }
#viewer.open { display: flex; }
#viewer.top { z-index: 85; }   /* versões abertas de dentro de um rascunho: fica por cima da janelinha */
#viewer .vbar { display: flex; align-items: center; gap: 8px; padding: calc(var(--safe-t) + 8px) 10px 8px; color: #fff; }
#viewer .vbar b { flex: 1; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#viewer .vbar button, #viewer .vfoot button { background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.14); color: #fff; height: 40px; min-width: 40px; border-radius: 10px; padding: 0 12px; }
#viewer .vstage { flex: 1; overflow: auto; display: flex; align-items: center; justify-content: center; touch-action: pan-x pan-y pinch-zoom; }
#viewer .vstage img { max-width: 100%; max-height: 100%; object-fit: contain; user-select: none; -webkit-user-select: none; }
#viewer .vstage.zoom { display: block; }
#viewer .vstage.zoom img { max-width: none; max-height: none; width: 200%; }
#viewer .vfoot { display: flex; gap: 8px; justify-content: center; padding: 8px 10px calc(var(--safe-b) + 10px); flex-wrap: wrap; }

/* listas e cartões */
.list { display: flex; flex-direction: column; gap: 8px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; }
.card.tap { cursor: pointer; }
.card .t { font-weight: 700; display: flex; align-items: center; gap: 8px; }
.card .t span.grow { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card .s { font-size: 12.5px; color: var(--muted); margin-top: 3px; display: flex; flex-wrap: wrap; gap: 6px 10px; }
.badge { display: inline-flex; align-items: center; height: 20px; padding: 0 8px; border-radius: 999px; font-size: 11px; font-weight: 750; border: 1px solid var(--line); color: var(--muted); }
.badge.late { color: var(--red); border-color: rgba(233,138,138,.4); background: rgba(233,138,138,.08); }
.badge.soon { color: var(--yellow); border-color: rgba(229,196,106,.4); background: rgba(229,196,106,.07); }
.badge.paid { color: var(--green); border-color: rgba(111,207,151,.38); background: rgba(111,207,151,.07); }
.badge.part { color: #b9a6ee; border-color: var(--accent-line); }
.group-h { font-size: 12px; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; margin: 16px 2px 6px; display: flex; gap: 8px; align-items: center; }
.group-h em { font-style: normal; font-weight: 700; }

/* financeiro */
.month { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
.month b { font-size: 16px; }
.month .btn { min-width: 44px; }
.sum { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
@media (min-width: 700px) { .sum { grid-template-columns: repeat(4, 1fr); } }
.sum .card { padding: 12px; }
.sum .k { font-size: 12px; color: var(--muted); font-weight: 650; }
.sum .v { font-size: 19px; font-weight: 800; margin-top: 4px; font-variant-numeric: tabular-nums; }
.v.pos { color: var(--green); } .v.neg { color: var(--red); } .v.wait { color: var(--yellow); }
.tx { display: flex; align-items: center; gap: 12px; }
.tx .ic { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; background: var(--card); font-size: 18px; flex: 0 0 auto; }
.tx .mid { flex: 1; min-width: 0; }
.tx .mid b { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 650; }
.tx .amt { font-weight: 800; font-variant-numeric: tabular-nums; white-space: nowrap; }
.bars { display: flex; flex-direction: column; gap: 8px; }
.bar { display: grid; grid-template-columns: 110px 1fr auto; gap: 10px; align-items: center; font-size: 13px; }
.bar .track { height: 8px; border-radius: 6px; background: var(--card); overflow: hidden; }
.bar .fill { height: 100%; background: rgba(169,139,232,.55); border-radius: 6px; }
.hide-money .money { filter: blur(7px); user-select: none; }

/* ideias */
.notes { columns: 2 160px; column-gap: 10px; }
@media (min-width: 820px) { .notes { columns: 4 200px; } }
.note { break-inside: avoid; margin: 0 0 10px; border-radius: 14px; padding: 12px; color: #1d1b22; position: relative; cursor: pointer; }
.note img { width: 100%; border-radius: 9px; display: block; margin-bottom: 8px; }
.note p { margin: 0; white-space: pre-wrap; word-wrap: break-word; font-size: 14px; }
.note .pin { position: absolute; top: 6px; right: 8px; font-size: 13px; }
.note small { display: block; margin-top: 8px; opacity: .6; font-size: 11px; }
.swatches { display: flex; gap: 10px; flex-wrap: wrap; }
.sw { width: 36px; height: 36px; border-radius: 50%; border: 2px solid transparent; }
.sw.on { border-color: #fff; box-shadow: 0 0 0 2px var(--accent); }

/* bottom sheet */
#sheet-bg { position: fixed; inset: 0; z-index: 70; background: rgba(0,0,0,.55); display: none; }
#sheet-bg.open { display: block; }
#sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 71; max-height: 92vh; overflow: auto; background: var(--panel); border-top: 1px solid var(--line); border-radius: 20px 20px 0 0; padding: 8px 18px calc(var(--safe-b) + 18px); transform: translateY(105%); transition: transform .22s ease; }
#sheet.open { transform: none; }
#sheet .grab { width: 40px; height: 4px; border-radius: 4px; background: var(--line); margin: 4px auto 10px; }
#sheet h2 { margin: 0 0 4px; font-size: 18px; }
#sheet .actions { display: flex; gap: 8px; margin-top: 18px; }
#sheet .actions .btn { flex: 1; }
@media (min-width: 820px) {
  #sheet { left: 50%; right: auto; bottom: auto; top: 50%; width: min(560px, 92vw); max-height: 86vh; border-radius: 18px; border: 1px solid var(--line); transform: translate(-50%, -46%); opacity: 0; pointer-events: none; transition: opacity .18s, transform .18s; }
  #sheet.open { transform: translate(-50%, -50%); opacity: 1; pointer-events: auto; }
  #sheet .grab { display: none; }
}
.opts { display: flex; flex-wrap: wrap; gap: 8px; }
.opt { height: 36px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); font-size: 13px; font-weight: 650; }
.opt.on { border-color: var(--accent-line); background: var(--accent-soft); }
.switch { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.switch:last-child { border-bottom: 0; }
.switch input { width: 46px; height: 26px; min-height: 0; appearance: none; -webkit-appearance: none; border-radius: 999px; background: var(--card); border: 1px solid var(--line); position: relative; padding: 0; flex: 0 0 auto; }
.switch input::after { content: ''; position: absolute; top: 2px; left: 2px; width: 20px; height: 20px; border-radius: 50%; background: var(--muted); transition: left .15s; }
.switch input:checked { background: var(--accent-soft); border-color: var(--accent-line); }
.switch input:checked::after { left: 22px; background: var(--accent); }
.sect { margin-bottom: 14px; }
.sect h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); margin: 18px 2px 8px; }
.notice { border: 1px solid rgba(229,196,106,.35); background: rgba(229,196,106,.06); border-radius: var(--r); padding: 12px 14px; }

#viewer .vbar .vt { flex: 1; min-width: 0; display: flex; flex-direction: column; }
#viewer .vbar .vt b { flex: none; }
#viewer .vbar .vt small { font-size: 12px; color: rgba(255,255,255,.62); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#viewer .vbar .vt small:empty { display: none; }
.stars { display: flex; gap: 6px; }
.stars button { width: 40px; height: 38px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--line); font-size: 19px; line-height: 1; }
.stars button.on { color: #d9bf72; border-color: rgba(217,191,114,.35); }
.workbox { margin-top: 16px; padding: 4px 14px 14px; border: 1px solid var(--line); border-radius: 14px; background: var(--bg); }
.workbox h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); margin: 12px 0 2px; }
.workbox[hidden], [hidden] { display: none !important; }
.gkind { margin: -2px 0 8px; }
.cthumbs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; }
.cthumbs img { width: 64px; height: 64px; object-fit: cover; border-radius: 10px; border: 1px solid var(--line); background: var(--card); flex: 0 0 auto; cursor: pointer; }
/* 🎞️ Webtoon Studio */
#studio { position: fixed; inset: 0; z-index: 65; background: var(--bg); display: none; flex-direction: column; }
#studio.open { display: flex; }
#studio .st-top { display: flex; align-items: center; gap: 10px; padding: calc(var(--safe-t) + 10px) 16px 10px; border-bottom: 1px solid var(--line); background: var(--panel); }
#studio .st-top b { flex: 1; font-size: 17px; }
#studio .st-body { flex: 1; overflow: auto; padding: 14px 16px calc(var(--safe-b) + 30px); }
#studio .st-wrap { max-width: 900px; margin: 0 auto; }
.st-files { display: flex; gap: 6px; overflow-x: auto; padding: 4px 0 8px; }
.st-files img { height: 92px; width: auto; border-radius: 8px; border: 1px solid var(--line); background: #fff; flex: 0 0 auto; }
.st-out { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; margin-top: 10px; }
.st-out.ig { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
.st-out figure { margin: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.st-out img { width: 100%; display: block; background: #fff; }
.st-out figcaption { font-size: 11px; color: var(--muted); padding: 4px 7px; display: flex; justify-content: space-between; }
.st-warn { color: var(--yellow); font-size: 13px; margin-top: 6px; }
#cv-cap { width: 100%; max-width: 420px; display: block; margin: 10px auto; border-radius: 10px; border: 1px solid var(--line); background: #222; touch-action: none; }
input[type=range] { min-height: 0; padding: 0; accent-color: var(--accent); border: 0; background: none; }
/* ⚖️ comparar (barrinha que corre) */
#cmp { position: fixed; inset: 0; z-index: 88; background: #000; display: none; flex-direction: column; }
#cmp.open { display: flex; }
#cmp .cbar { display: flex; align-items: center; gap: 10px; padding: calc(var(--safe-t) + 8px) 10px 8px; color: #fff; }
#cmp .cbar b { flex: 1; }
#cmp .cbar button { background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.14); color: #fff; height: 40px; min-width: 40px; border-radius: 10px; padding: 0 12px; }
#cmp .cbox { flex: 1; position: relative; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; margin: 0 8px calc(var(--safe-b) + 10px); }
#cmp .cbox img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; pointer-events: none; }
#cmp .cbox .ca { clip-path: inset(0 50% 0 0); }
#cmp .cline { position: absolute; top: 0; bottom: 0; left: 50%; width: 2px; margin-left: -1px; background: #fff; box-shadow: 0 0 6px rgba(0,0,0,.6); pointer-events: none; }
#cmp .cknob { position: absolute; top: 50%; left: 50%; width: 44px; height: 44px; margin: -22px 0 0 -22px; border-radius: 50%; background: #fff; color: #222; display: grid; place-items: center; font-weight: 900; box-shadow: 0 2px 10px rgba(0,0,0,.5); pointer-events: none; }
#cmp .clab { position: absolute; top: 10px; padding: 3px 9px; border-radius: 8px; background: rgba(0,0,0,.55); color: #fff; font-size: 12px; font-weight: 700; pointer-events: none; }
#toast { position: fixed; left: 50%; bottom: calc(var(--nav-h) + var(--safe-b) + 20px); transform: translateX(-50%) translateY(20px); opacity: 0; z-index: 90; background: #262338; border: 1px solid var(--accent-line); color: var(--text); padding: 10px 16px; border-radius: 12px; font-size: 14px; max-width: 90vw; text-align: center; transition: opacity .2s, transform .2s; pointer-events: none; }
#toast.on { opacity: 1; transform: translateX(-50%); }
.credits { text-align: center; font-size: 12px; color: var(--muted); margin: 26px 0 6px; }
.thumb-pick { display: flex; gap: 10px; align-items: center; }
.thumb-pick img { width: 64px; height: 64px; object-fit: cover; border-radius: 10px; border: 1px solid var(--line); }
</style>
</head>
<body>
<div id="app">
  <header class="top"><h1 id="h-title">🎨 Galeria</h1><div class="sub" id="h-sub"></div></header>
  <main id="main"></main>
</div>
<button class="fab" id="fab" aria-label="Adicionar">＋</button>
<nav class="tabs" id="tabs">
  <button data-tab="gal" class="on"><span class="ic">🖼️</span>Galeria</button>
  <button data-tab="jobs"><span class="ic">👥</span>Trabalhos</button>
  <button data-tab="fin"><span class="ic">💰</span>Financeiro</button>
  <button data-tab="ideas"><span class="ic">💡</span>Ideias</button>
  <button data-tab="more"><span class="ic">⚙️</span>Mais</button>
</nav>
<div id="viewer"><div class="vbar"><button id="v-close" aria-label="Fechar">✕</button><div class="vt"><b id="v-title"></b><small id="v-sub"></small></div><span id="v-pos" class="muted" style="font-size:12px"></span></div>
  <div class="vstage" id="v-stage"><img id="v-img" alt=""></div>
  <div class="vfoot"><button id="v-prev" aria-label="Anterior">‹</button><button id="v-edit">✏️ Editar</button><button id="v-share">📤 Compartilhar</button><button id="v-next" aria-label="Próxima">›</button></div>
</div>
<div id="studio"><div class="st-top"><button class="btn" id="st-close">✕</button><b>🎞️ Webtoon Studio</b></div><div class="st-body"><div class="st-wrap" id="st-main"></div></div></div>
<div id="cmp"><div class="cbar"><button id="cmp-close">✕</button><b id="cmp-title">⚖️ Comparar</b><button id="cmp-swap" title="Trocar os lados">⇄</button></div>
  <div class="cbox" id="cmp-box"><img class="cb" id="cmp-b" alt=""><img class="ca" id="cmp-a" alt=""><div class="cline" id="cmp-line"></div><div class="cknob" id="cmp-knob">⇆</div><span class="clab" id="cmp-la" style="left:10px"></span><span class="clab" id="cmp-lb" style="right:10px"></span></div></div>
<div id="sheet-bg"></div><div id="sheet" role="dialog" aria-modal="true"></div>
<div id="toast" role="status"></div>
<input type="file" id="pick-img" accept="image/*" multiple hidden>
<input type="file" id="pick-backup" accept=".zip,application/zip" hidden>

<script>
'use strict';
/* =====================================================================
   Criatura Light — versão leve do Criatura Problemática PRO para celular/tablet
   Dados só neste aparelho (IndexedDB). Backup: arquivo .zip (Mais → Backup).
   ===================================================================== */
const APP_VER = '1.04';
const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = p => p + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const today = () => { const d = new Date(); return new Date(d - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 10); };
const norm = t => String(t || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
const fmtDate = s => { if (!s) return ''; const [y, m, d] = String(s).slice(0, 10).split('-'); return d ? `${d}/${m}/${y}` : s; };
const daysTo = s => { if (!s) return null; const a = new Date(today() + 'T00:00'), b = new Date(String(s).slice(0, 10) + 'T00:00'); return Math.round((b - a) / 864e5); };
const money = (v, cur = 'BRL') => (Number(v) || 0).toLocaleString(cur === 'USD' ? 'en-US' : 'pt-BR', { style: 'currency', currency: cur === 'USD' ? 'USD' : 'BRL' });
let toastT = 0;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 2600); }

/* ---------------- armazenamento (IndexedDB) ---------------- */
const DB_NAME = 'criatura-light';
let dbP = null;
function db() {
  if (dbP) return dbP;
  dbP = new Promise((res, rej) => {
    const r = indexedDB.open(DB_NAME, 1);
    r.onupgradeneeded = () => { const d = r.result; if (!d.objectStoreNames.contains('kv')) d.createObjectStore('kv'); if (!d.objectStoreNames.contains('blobs')) d.createObjectStore('blobs'); };
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
  return dbP;
}
async function idb(store, mode, fn) {
  const d = await db();
  return new Promise((res, rej) => { const tx = d.transaction(store, mode); const st = tx.objectStore(store); const r = fn(st); tx.oncomplete = () => res(r && 'result' in r ? r.result : undefined); tx.onerror = () => rej(tx.error); });
}
const blobPut = (k, b) => idb('blobs', 'readwrite', s => s.put(b, k));
const blobGet = k => idb('blobs', 'readonly', s => s.get(k));
const blobDel = k => idb('blobs', 'readwrite', s => s.delete(k));
const blobKeys = () => idb('blobs', 'readonly', s => s.getAllKeys());

const DEF = () => ({
  v: 1, profile: { name: '', handle: '' },
  settings: { currency: 'BRL', safe: false, safePin: '', hideMoney: false, lastBackup: 0, changedAt: 0, snoozeBackup: 0,
    fx: { rate: 5.4, at: 0, fee: 0 },
    accounts: ['Nubank', 'Inter', 'Dinheiro', 'PayPal'],
    cats: { gasto: ['Material', 'Comida', 'Contas', 'Mimos', 'Outros'], ganho: ['Comissão', 'Venda', 'Outros'] } },
  arts: [], folders: [], clients: [], works: [], fin: [], notes: [], drafts: []
});
let S = DEF();
let saveT = 0;
function save(touch = true) {
  if (touch) { S.settings.changedAt = Date.now(); if (!S.settings.since) S.settings.since = Date.now(); }   // since: começou a usar (lembrete de backup conta a partir daqui)
  clearTimeout(saveT);
  saveT = setTimeout(() => idb('kv', 'readwrite', s => s.put(JSON.parse(JSON.stringify(S)), 'state')).catch(e => toast('⚠️ Não consegui salvar: ' + e.message)), 250);
  askPersist();
}
async function load() {
  try { const v = await idb('kv', 'readonly', s => s.get('state')); if (v) S = Object.assign(DEF(), v, { settings: Object.assign(DEF().settings, v.settings || {}, { fx: Object.assign(DEF().settings.fx, (v.settings || {}).fx || {}) }) }); } catch (e) { console.warn(e); }
}
let persistAsked = false;
async function askPersist() {   // pede pro navegador não apagar os dados quando faltar espaço
  if (persistAsked || !navigator.storage || !navigator.storage.persist) return; persistAsked = true;
  try { if (!(await navigator.storage.persisted())) await navigator.storage.persist(); } catch (e) {}
}

/* ---------------- imagens ---------------- */
const urlCache = new Map();
async function blobURL(key) {
  if (!key) return '';
  if (urlCache.has(key)) return urlCache.get(key);
  const b = await blobGet(key); if (!b) return '';
  const u = URL.createObjectURL(b); urlCache.set(key, u); return u;
}
function dropURL(key) { const u = urlCache.get(key); if (u) { URL.revokeObjectURL(u); urlCache.delete(key); } }
async function makeThumb(file, max = 480) {
  const bmp = await createImageBitmap(file).catch(() => null);
  let w, h, draw;
  if (bmp) { w = bmp.width; h = bmp.height; draw = (c, cw, ch) => c.drawImage(bmp, 0, 0, cw, ch); }
  else {
    const u = URL.createObjectURL(file); const im = new Image(); im.src = u; await im.decode(); URL.revokeObjectURL(u);
    w = im.naturalWidth; h = im.naturalHeight; draw = (c, cw, ch) => c.drawImage(im, 0, 0, cw, ch);
  }
  const k = Math.min(1, max / Math.max(w, h)), cv = document.createElement('canvas');
  cv.width = Math.max(1, Math.round(w * k)); cv.height = Math.max(1, Math.round(h * k));
  const c = cv.getContext('2d'); c.imageSmoothingQuality = 'high'; draw(c, cv.width, cv.height);
  const blob = await new Promise(r => cv.toBlob(r, 'image/jpeg', .82));
  return { blob, w, h };
}
async function addImages(files, extra = {}) {
  files = [...files].filter(f => /^image\//.test(f.type) || /\.(png|jpe?g|webp|gif|heic|avif)$/i.test(f.name));
  if (!files.length) return 0;
  toast(`📥 Adicionando ${files.length} imagem(ns)…`);
  let n = 0;
  for (const f of files) {
    try {
      const id = uid('art'), t = await makeThumb(f);
      await blobPut(id + ':o', f); await blobPut(id + ':t', t.blob);
      S.arts.unshift({ id, title: niceTitle(f.name), date: new Date(f.lastModified || Date.now()).toISOString().slice(0, 10), added: Date.now(), w: t.w, h: t.h, nsfw: false, folder: '', tags: [], notes: '', clientId: '', ...extra });
      n++;
    } catch (e) { console.warn(e); }
  }
  save(); render();
  toast(n ? `✅ ${n} imagem(ns) adicionada(s)` : '⚠️ Não consegui ler essas imagens');
  return n;
}

/* ---------------- bottom sheet / diálogos ---------------- */
let sheetClose = null;
function openSheet(html, onMount, onClose) {
  const sh = $('#sheet'); sh.innerHTML = '<div class="grab"></div>' + html;
  $('#sheet-bg').classList.add('open'); requestAnimationFrame(() => sh.classList.add('open'));
  sheetClose = onClose || null;
  if (onMount) onMount(sh);
}
function closeSheet() { $('#sheet').classList.remove('open'); $('#sheet-bg').classList.remove('open'); const f = sheetClose; sheetClose = null; if (f) f(); }
$('#sheet-bg').onclick = closeSheet;
function ask(title, body, okText = 'OK', danger = false) {
  return new Promise(res => {
    let done = false; const fin = v => { if (done) return; done = true; res(v); };
    openSheet(`<h2>${esc(title)}</h2>${body ? `<p class="muted" style="white-space:pre-line">${esc(body)}</p>` : ''}<div class="actions"><button class="btn ghost" data-a="no">Cancelar</button><button class="btn ${danger ? 'danger' : 'primary'}" data-a="ok">${esc(okText)}</button></div>`,
      sh => { sh.querySelector('[data-a=no]').onclick = () => { fin(false); closeSheet(); }; sh.querySelector('[data-a=ok]').onclick = () => { fin(true); closeSheet(); }; }, () => fin(false));
  });
}
function askText(title, value = '', ph = '') {
  return new Promise(res => {
    let done = false; const fin = v => { if (done) return; done = true; res(v); };
    openSheet(`<h2>${esc(title)}</h2><input id="ask-in" value="${esc(value)}" placeholder="${esc(ph)}" autocomplete="off"><div class="actions"><button class="btn ghost" data-a="no">Cancelar</button><button class="btn primary" data-a="ok">Salvar</button></div>`,
      sh => { const i = sh.querySelector('#ask-in'); setTimeout(() => i.focus(), 250); const ok = () => { fin(i.value.trim()); closeSheet(); };
        i.onkeydown = e => { if (e.key === 'Enter') ok(); }; sh.querySelector('[data-a=no]').onclick = () => { fin(null); closeSheet(); }; sh.querySelector('[data-a=ok]').onclick = ok; }, () => fin(null));
  });
}
const optsHtml = (name, list, cur) => `<div class="opts" data-opts="${name}">${list.map(([v, l]) => `<button type="button" class="opt${v === cur ? ' on' : ''}" data-v="${esc(v)}">${l}</button>`).join('')}</div>`;
function bindOpts(root, name, onPick) { const box = root.querySelector(`[data-opts="${name}"]`); if (!box) return; box.querySelectorAll('.opt').forEach(b => b.onclick = () => { box.querySelectorAll('.opt').forEach(x => x.classList.toggle('on', x === b)); onPick(b.dataset.v); }); }
const optVal = (root, name) => { const b = root.querySelector(`[data-opts="${name}"] .opt.on`); return b ? b.dataset.v : ''; };

/* ---------------- navegação ---------------- */
let tab = 'gal';
const TITLES = { gal: '🖼️ Galeria', jobs: '👥 Trabalhos', fin: '💰 Financeiro', ideas: '💡 Ideias', more: '⚙️ Mais' };
$$('#tabs button').forEach(b => b.onclick = () => { if (tab === b.dataset.tab) { window.scrollTo({ top: 0, behavior: 'smooth' }); return; } tab = b.dataset.tab; sel.clear(); selecting = false; render(); window.scrollTo(0, 0); });
function render() {
  $$('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
  $('#h-title').textContent = TITLES[tab];
  document.body.classList.toggle('hide-money', !!S.settings.hideMoney);
  const m = $('#main'); m.innerHTML = '';
  $('#fab').style.display = tab === 'more' || selecting ? 'none' : '';
  $('#h-sub').textContent = '';
  ({ gal: renderGal, jobs: renderJobs, fin: renderFin, ideas: renderIdeas, more: renderMore })[tab](m);
  updateBackupDot();
}
$('#fab').onclick = () => ({ gal: () => $('#pick-img').click(), jobs: () => (jobsView === 'clients' ? editClient() : editWork()), fin: () => editTx(), ideas: () => (ideasView === 'drafts' ? editDraft() : editNote()) })[tab]?.();
$('#pick-img').onchange = async e => { const fs = [...e.target.files]; e.target.value = ''; await addImages(fs, galFolder && galFolder !== '*' ? { folder: galFolder } : {}); };

/* =====================================================================
   🖼️ GALERIA
   ===================================================================== */
let galMode = 'sfw', galKind = '', galFolder = '', galQ = '', selecting = false;
const sel = new Set();
function galList() {
  const q = norm(galQ);
  return S.arts.filter(a => {
    if (a.nsfw && (S.settings.safe || galMode === 'sfw')) return false;   // 🛡️ modo seguro esconde tudo que é +18
    if (galMode === 'nsfw' && !a.nsfw) return false;
    if (galFolder && a.folder !== galFolder) return false;
    if (galKind && artKind(a) !== galKind) return false;
    if (q && !norm([a.title, (a.tags || []).join(' '), a.notes, (S.clients.find(c => c.id === a.clientId) || {}).name].join(' ')).includes(q)) return false;
    return true;
  });
}
function renderGal(m) {
  if (S.settings.safe && galMode === 'nsfw') galMode = 'sfw';
  const vis = S.arts.filter(a => !(a.nsfw && S.settings.safe));
  $('#h-sub').textContent = `${vis.length} arte(s)`;
  m.innerHTML = `<div class="toolbar"><div class="seg"><button data-gm="sfw" class="${galMode === 'sfw' ? 'on' : ''}">🟢 Só SFW</button>${S.settings.safe ? '' : `<button data-gm="nsfw" class="${galMode === 'nsfw' ? 'on' : ''}">🔞 NSFW</button>`}<button data-gm="all" class="${galMode === 'all' ? 'on' : ''}">🌐 Tudo</button></div>
      <button class="btn ghost" id="safe-btn" style="min-height:38px;padding:0 10px" title="Modo seguro">${S.settings.safe ? '🛡️ ON' : '🛡️ OFF'}</button>
      <input class="search" id="gal-q" type="search" placeholder="🔎 Buscar…" value="${esc(galQ)}"></div>
    <div class="seg gkind">${[['pessoal', '🎨 Pessoais'], ['trabalho', '💼 Trabalhos']].map(([k, l]) => `<button data-gk="${k}" class="${galKind === k ? 'on' : ''}">${l}</button>`).join('')}</div>
    <div class="chips" id="gal-folders">${[['', '🖼️', 'Todas', vis.length]].concat(S.folders.map(f => [f.id, f.ic, f.name, vis.filter(a => a.folder === f.id).length])).map(([id, ic, n, c]) => `<button class="chip${galFolder === id ? ' on' : ''}" data-f="${esc(id)}">${ic} ${esc(n)} <em>${c}</em></button>`).join('')}<button class="chip new" id="f-new">＋ Pasta</button>${galFolder ? '<button class="chip" id="f-edit">⋯</button>' : ''}</div>
    <div class="${selecting ? 'selecting' : ''}" id="gal-wrap"></div>`;
  $$('[data-gm]', m).forEach(b => b.onclick = () => { galMode = b.dataset.gm; render(); });
  $$('[data-gk]', m).forEach(b => b.onclick = () => { galKind = galKind === b.dataset.gk ? '' : b.dataset.gk; render(); });   // tocar de novo = mostra todas
  $('#safe-btn', m).onclick = toggleSafe;
  let t = 0; $('#gal-q', m).oninput = e => { galQ = e.target.value; clearTimeout(t); t = setTimeout(() => drawGrid(), 150); };
  $$('[data-f]', m).forEach(b => b.onclick = () => { galFolder = b.dataset.f; render(); });
  $('#f-new', m).onclick = async () => { const n = await askText('Nova pasta', '', 'ex.: 🐉 Fanarts'); if (!n) return; const mm = n.match(/^(\p{Extended_Pictographic}️?)\s*(.+)$/u); S.folders.push({ id: uid('f'), ic: mm ? mm[1] : '📁', name: mm ? mm[2] : n }); save(); render(); };
  if ($('#f-edit', m)) $('#f-edit', m).onclick = () => folderMenu(galFolder);
  drawGrid();
}
async function drawGrid() {
  const wrap = $('#gal-wrap'); if (!wrap) return;
  const list = galList();
  if (!list.length) { wrap.innerHTML = `<div class="empty">${galMode === 'nsfw' ? '🔞 Nenhuma arte +18 ainda.<br>Segure uma arte e toque em <b>🔞 +18</b>, ou marque nas informações dela.' : S.arts.length ? 'Nada por aqui com esse filtro.' : '<b>Sua galeria está vazia</b><br>Toque em ＋ para adicionar artes do celular.'}</div>`; return; }
  wrap.innerHTML = `<div class="grid">${list.map(a => `<div class="tile${sel.has(a.id) ? ' sel' : ''}" data-id="${a.id}"><img alt="" data-k="${a.id}:t">${a.nsfw ? '<span class="tg">18+</span>' : ''}<span class="ck"></span></div>`).join('')}</div>`;
  for (const im of $$('img[data-k]', wrap)) blobURL(im.dataset.k).then(u => { if (u) im.src = u; });
  $$('.tile', wrap).forEach(tile => {
    const id = tile.dataset.id; let lp = 0, moved = false;
    tile.addEventListener('pointerdown', () => { moved = false; lp = setTimeout(() => { lp = -1; if (!selecting) { selecting = true; sel.add(id); render(); if (navigator.vibrate) navigator.vibrate(15); } }, 480); });
    tile.addEventListener('pointermove', () => { moved = true; });
    const cancel = () => { if (lp > 0) clearTimeout(lp); };
    tile.addEventListener('pointerup', cancel); tile.addEventListener('pointercancel', () => { cancel(); lp = 0; });
    tile.addEventListener('contextmenu', e => e.preventDefault());
    tile.onclick = () => {
      if (lp === -1) { lp = 0; return; }
      if (selecting) { sel.has(id) ? sel.delete(id) : sel.add(id); tile.classList.toggle('sel', sel.has(id)); updSelBar(); return; }
      openViewer(id, list.map(a => a.id));
    };
  });
  updSelBar();
}
function updSelBar() {
  let bar = $('#selbar');
  if (!selecting) { if (bar) bar.remove(); return; }
  if (!bar) { bar = document.createElement('div'); bar.id = 'selbar'; bar.className = 'selbar'; document.body.appendChild(bar); }
  bar.innerHTML = `<button class="btn" data-s="x">✕ ${sel.size}</button><button class="btn" data-s="all">Todas</button>${sel.size === 2 ? '<button class="btn primary" data-s="cmp">⚖️ Comparar</button>' : ''}<button class="btn" data-s="move" ${sel.size ? '' : 'disabled'}>📂 Mover</button><button class="btn" data-s="nsfw" ${sel.size ? '' : 'disabled'}>🔞 +18</button><button class="btn" data-s="sfw" ${sel.size ? '' : 'disabled'}>🟢 Livre</button><button class="btn danger" data-s="del" ${sel.size ? '' : 'disabled'}>🗑️</button>`;
  bar.querySelectorAll('[data-s]').forEach(b => b.onclick = async () => {
    const a = b.dataset.s, items = S.arts.filter(x => sel.has(x.id));
    if (a === 'x') { selecting = false; sel.clear(); render(); return; }
    if (a === 'all') { galList().forEach(x => sel.add(x.id)); drawGrid(); return; }
    if (a === 'cmp') { const [x, y] = S.arts.filter(z => sel.has(z.id)); return openCompare(x.id + ':o', y.id + ':o', x.title || 'A', y.title || 'B', 'Comparar artes'); }
    if (a === 'nsfw' || a === 'sfw') { items.forEach(x => x.nsfw = a === 'nsfw'); save(); toast(`${items.length} arte(s) marcadas como ${a === 'nsfw' ? '+18' : 'livres'}`); }
    if (a === 'move') { const f = await pickFolder(); if (f === null) return; items.forEach(x => x.folder = f); save(); toast(`${items.length} arte(s) movidas`); }
    if (a === 'del') { if (!await ask(`Apagar ${items.length} arte(s)?`, 'Elas saem do Criatura Light deste aparelho. As fotos originais da galeria do celular não são apagadas.', 'Apagar', true)) return; for (const x of items) await delArt(x); toast('🗑️ Apagadas'); }
    selecting = false; sel.clear(); render();
  });
}
function pickFolder() {
  return new Promise(res => {
    let done = false; const fin = v => { if (done) return; done = true; res(v); };
    openSheet(`<h2>Mover para…</h2><div class="list" style="margin-top:10px">${[['', '🖼️', 'Sem pasta']].concat(S.folders.map(f => [f.id, f.ic, f.name])).map(([id, ic, n]) => `<button class="btn" style="justify-content:flex-start" data-pf="${esc(id)}">${ic} ${esc(n)}</button>`).join('')}<button class="btn ghost" data-pf="__new">＋ Nova pasta…</button></div>`,
      sh => sh.querySelectorAll('[data-pf]').forEach(b => b.onclick = async () => {
        let v = b.dataset.pf;
        if (v === '__new') { closeSheet(); const n = await askText('Nova pasta', '', 'ex.: 🐉 Fanarts'); if (!n) return fin(null); const mm = n.match(/^(\p{Extended_Pictographic}️?)\s*(.+)$/u); v = uid('f'); S.folders.push({ id: v, ic: mm ? mm[1] : '📁', name: mm ? mm[2] : n }); return fin(v); }
        fin(v); closeSheet();
      }), () => fin(null));
  });
}
async function folderMenu(id) {
  const f = S.folders.find(x => x.id === id); if (!f) return;
  openSheet(`<h2>${esc(f.ic + ' ' + f.name)}</h2><div class="list" style="margin-top:10px"><button class="btn" data-a="ren">✏️ Renomear</button><button class="btn danger" data-a="del">🗑️ Apagar pasta (as artes ficam)</button></div>`, sh => {
    sh.querySelector('[data-a=ren]').onclick = async () => { closeSheet(); const n = await askText('Renomear pasta', f.ic + ' ' + f.name); if (!n) return; const mm = n.match(/^(\p{Extended_Pictographic}️?)\s*(.+)$/u); f.ic = mm ? mm[1] : '📁'; f.name = mm ? mm[2] : n; save(); render(); };
    sh.querySelector('[data-a=del]').onclick = () => { S.arts.forEach(a => { if (a.folder === id) a.folder = ''; }); S.folders = S.folders.filter(x => x.id !== id); galFolder = ''; save(); closeSheet(); render(); };
  });
}
async function delArt(a) {
  S.arts = S.arts.filter(x => x !== a);
  for (const k of [a.id + ':o', a.id + ':t']) { dropURL(k); await blobDel(k); }
  save();
}
/* visualizador (artes da galeria, ou versões de um rascunho) */
let vIds = [], vIdx = 0, vPhotos = null;
async function openViewer(id, ids) {
  vPhotos = null; $('#v-edit').style.display = '';
  vIds = ids; vIdx = Math.max(0, ids.indexOf(id)); $('#viewer').classList.add('open'); document.body.style.overflow = 'hidden'; await showV();
}
async function openPhotos(keys, idx, title) {
  vPhotos = { title }; $('#v-edit').style.display = 'none'; $('#viewer').classList.add('top');
  vIds = keys; vIdx = idx; $('#viewer').classList.add('open'); document.body.style.overflow = 'hidden'; await showV();
}
async function showV() {
  if (vPhotos) { $('#v-title').textContent = `${vPhotos.title} · versão ${vIdx + 1}`; $('#v-sub').textContent = ''; $('#v-pos').textContent = `${vIdx + 1}/${vIds.length}`; $('#v-stage').classList.remove('zoom'); $('#v-img').src = await blobURL(vIds[vIdx]); return; }
  const a = S.arts.find(x => x.id === vIds[vIdx]); if (!a) return closeViewer();
  $('#v-title').textContent = a.title || 'Sem título'; $('#v-sub').textContent = artLine(a);
  $('#v-pos').textContent = `${vIdx + 1}/${vIds.length}`;
  $('#v-stage').classList.remove('zoom');
  const img = $('#v-img'); img.src = await blobURL(a.id + ':t');
  blobURL(a.id + ':o').then(u => { if (u && vIds[vIdx] === a.id) img.src = u; });
}
function closeViewer() { $('#viewer').classList.remove('open', 'top'); document.body.style.overflow = ''; [...urlCache.keys()].filter(k => k.endsWith(':o')).forEach(dropURL); vPhotos = null; }
$('#v-close').onclick = closeViewer;
$('#v-prev').onclick = () => { if (vIdx > 0) { vIdx--; showV(); } };
$('#v-next').onclick = () => { if (vIdx < vIds.length - 1) { vIdx++; showV(); } };
$('#v-stage').ondblclick = () => $('#v-stage').classList.toggle('zoom');

/* 🛡️ modo seguro: esconde tudo que é +18 (galeria e rascunhos). Com PIN, só desliga quem souber. */
async function pinHash(pin) {
  const txt = 'criatura-light:' + pin;
  try { const d = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(txt)); return [...new Uint8Array(d)].map(b => b.toString(16).padStart(2, '0')).join(''); }
  catch (e) { let h = 2166136261; for (let i = 0; i < txt.length; i++) { h ^= txt.charCodeAt(i); h = Math.imul(h, 16777619); } return 'f' + (h >>> 0).toString(16); }
}
function askPin(title) {
  return new Promise(res => {
    let done = false; const fin = v => { if (done) return; done = true; res(v); };
    openSheet(`<h2>${esc(title)}</h2><input id="pin-in" type="password" inputmode="numeric" autocomplete="off" placeholder="PIN"><div class="actions"><button class="btn ghost" data-a="no">Cancelar</button><button class="btn primary" data-a="ok">OK</button></div>`,
      sh => { const i = sh.querySelector('#pin-in'); setTimeout(() => i.focus(), 250); const ok = () => { fin(i.value.trim()); closeSheet(); };
        i.onkeydown = e => { if (e.key === 'Enter') ok(); }; sh.querySelector('[data-a=no]').onclick = () => { fin(null); closeSheet(); }; sh.querySelector('[data-a=ok]').onclick = ok; }, () => fin(null));
  });
}
async function toggleSafe() {
  const st = S.settings;
  if (!st.safe) { st.safe = true; save(false); render(); return toast('🛡️ Modo seguro ligado — artes +18 escondidas'); }
  if (st.safePin) { const p = await askPin('🔒 PIN para desligar o modo seguro'); if (p == null) return render(); if (await pinHash(p) !== st.safePin) { render(); return toast('PIN errado'); } }
  st.safe = false; save(false); render(); toast('🔓 Modo seguro desligado');
}

function payBadge(w) {

  if (t && p >= t) return '<span class="badge paid">Pago</span>';
  if (p > 0) return `<span class="badge part money">Recebido ${money(p, w.cur)}</span>`;

function dueBadge(w) {

/* =====================================================================
   🎞️ WEBTOON STUDIO — fatiar episódio, virar carrossel do Insta, capinhas
   Tamanhos: WEBTOON 800 de largura, até 1280 de altura e 2 MB por imagem (100 imagens / 20 MB por episódio);
   Tapas 940 de largura; Instagram 1080×1080 ou 1080×1350, até 20 slides.
   A tira “virtual” nunca vira um canvas gigante (o iPhone/iPad não aguenta): desenha só o pedaço necessário.
   ===================================================================== */
const ST = { srcs: [], W: 800, an: null, out: [], view: 'cut', igOpts: { fmt: 'sq', per: 'auto', bg: '#ffffff', head: true }, cutOpts: { plat: 'webtoon', smart: true, w: 800, h: 1280 }, cap: null };

async function stLoad(files) {
  ST.srcs.forEach(x => x.bmp && x.bmp.close && x.bmp.close());
  files = [...files].filter(f => /^image\//.test(f.type)).sort((a, b) => natCmp(a.name, b.name));
  ST.srcs = []; ST.out = []; ST.an = null;
  for (const f of files) { try { const bmp = await createImageBitmap(f); ST.srcs.push({ name: f.name, bmp, w: bmp.width, h: bmp.height, file: f }); } catch (e) { toast('⚠️ Não abri ' + f.name); } }

}

    ctx.drawImage(s.bmp, cropX0 / s.k, (a - s.off) / s.k, (cropX1 - cropX0) / s.k, (b - a) / s.k, dx, dy + (a - y0) * scale, (cropX1 - cropX0) * scale, (b - a) * scale);

    c.fillStyle = '#fff'; c.fillRect(0, 0, AW, h); stDraw(c, y / f, (y + h) / f, 0, 0, f);

/* 🖼️ capinhas no tamanho e no peso certos */

/* ⚖️ comparar duas imagens: arraste a barrinha pra um lado e pro outro */
let cmpState = null;
async function openCompare(keyA, keyB, labA, labB, title) {
  cmpState = { keyA, keyB, labA, labB, pos: .5 };
  $('#cmp-title').textContent = '⚖️ ' + (title || 'Comparar');

}

  const c = cmpState; $('#cmp-a').src = await blobURL(c.keyA); $('#cmp-b').src = await blobURL(c.keyB);
  $('#cmp-la').textContent = c.labA; $('#cmp-lb').textContent = c.labB; cmpMove(c.pos);
}
function cmpMove(p) {

  $('#cmp-line').style.left = $('#cmp-knob').style.left = (p * 100).toFixed(2) + '%';
}
{ const box = $('#cmp-box'); let on = false;
  const at = e => { const r = box.getBoundingClientRect(); cmpMove((e.clientX - r.left) / r.width); };
  box.addEventListener('pointerdown', e => { on = true; box.setPointerCapture(e.pointerId); at(e); });
  box.addEventListener('pointermove', e => { if (on) at(e); });
  box.addEventListener('pointerup', () => { on = false; }); box.addEventListener('pointercancel', () => { on = false; }); }
